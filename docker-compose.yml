services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: openobserve
    restart: unless-stopped
    ports:
      - "5080:5080"
    environment:
      - ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL}
      - ZO_ROOT_USER_PASSWORD=${ZO_ROOT_USER_PASSWORD}
      - ZO_SLO_ENABLED=true
    volumes:
      - openobserve_data:/data

  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    restart: unless-stopped
    depends_on:
      - openobserve
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    environment:
      - OLLAMA_API_BASE=http://<OLLAMA_HOST>:11434
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - OTEL_EXPORTER=otlp_http
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://openobserve:5080/api/default
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/json
      - OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic ${OPENOBSERVE_BASIC_TOKEN}
      - OTEL_SERVICE_NAME=litellm-proxy
    command: ["--config", "/app/config.yaml", "--port", "4000"]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - litellm-proxy
    ports:
      - "3001:8080"
    environment:
      - OPENAI_API_BASE_URL=http://litellm-proxy:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - WEBUI_AUTH=true
      - ENABLE_FORWARD_USER_INFO_HEADERS=True
    volumes:
      - open_webui_data:/app/backend/data

volumes:
  openobserve_data:
  open_webui_data:
